name: 'Feature Request'
description: 'Suggest an improvement for Qwen-Live-Harness'
labels:
  - 'enhancement'
body:
  - type: 'markdown'
    attributes:
      value: |-
        > [!IMPORTANT]
        > Thanks for taking the time to suggest an enhancement!
        >
        > Please search **[existing issues](https://github.com/QwenLM/Qwen-Live-Harness/issues)** to see if a similar feature has already been requested.

  - type: 'textarea'
    id: 'feature'
    attributes:
      label: 'What would you like to be added?'
      description: 'A clear and concise description of the enhancement.'
    validations:
      required: true

  - type: 'textarea'
    id: 'rationale'
    attributes:
      label: 'Why is this needed?'
      description: 'Describe the use case and how this would improve using Qwen-Live-Harness.'
    validations:
      required: true

  - type: 'textarea'
    id: 'additional-context'
    attributes:
      label: 'Additional context'
      description: 'Add any other context, proposed behavior, or screenshots about the feature request. Redact private information.'
