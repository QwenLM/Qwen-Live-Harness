name: 'Qwen Live Harness CI'

on:
  pull_request:
  push:
    branches: ['main']
  merge_group:
  workflow_dispatch:

permissions:
  contents: 'read'

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  agent-remote:
    name: 'Independent Agent Remote (${{ matrix.os }})'
    strategy:
      matrix:
        os: ['ubuntu-latest', 'macos-latest']
    runs-on: '${{ matrix.os }}'
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 'packages/agent-remote'
    steps:
      - uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10'
      - uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'packages/agent-remote/package-lock.json'
      - run: 'npm ci'
      - run: 'npm run build && npm run typecheck && npm test'
      - run: 'npm run check:package'
      - run: 'npm run test:macos'
        if: "runner.os == 'macOS'"
  daemon:
    name: 'Standalone daemon'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 30
    steps:
      - uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
      - uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: 'npm ci'
      - run: 'npm run build && npm run typecheck'
      - run: 'npm run lint:all && npm run format:check'
      - run: 'npm run test:daemon && npm run test:scripts && npm run test:integration'
      - run: 'npm run check:boundaries && npm run check:package'
