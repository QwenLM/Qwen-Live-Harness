        } else if (s === 'editMemory') {
          title = t.memoryEditor;
          body = `<label class="sr-only" for="memory-edit">${t.memoryEditor}</label><input id="memory-edit" data-input="memoryEdit" value="${escape(state.memoryValue || t.memoryFact)}"><button class="primary" data-action="saveMemory">${t.saveMemory}</button>`;
        } else if (s === 'artifact') {
          title = t.previewArtifactTitle;
          body = `<p>${t.previewArtifactBody}</p>${cover('design')}`;
        } else {
          title = t.sessionSheetTitle;
          body = `<p class="task-eyebrow">${s === 'doneTask' ? 'MacBook Pro · Codex' : 'Mac mini · Qwen Code'}</p><h3>${s === 'doneTask' ? t.research : t.taskName}</h3><p>${t.sessionSheetBody}</p><p>Session · ${s === 'doneTask' ? 'ar-demo-research-01' : 'ar-demo-ios-01'}</p><label class="sr-only" for="task-followup">${t.addDetail}</label><input id="task-followup" data-input="followup" placeholder="${t.addDetail}"><button class="primary" data-action="addDetail">${t.addDetail}</button>`;
        }
        return `<div class="sheet-scrim"><section class="sheet" role="dialog" aria-modal="true" aria-label="${escape(title)}"><div class="sheet-handle"></div><div class="sheet-head"><h2>${title}</h2>${button('close', 'closeSheet', t.close)}</div>${body}</section></div>`;
      }
      const renderScreen = (index) =>
        [home, voice, receipt, workbench, detail, memory][index]();
      function phone(index, board = false) {
        return `<div class="phone" data-screen="${index}"><div class="statusbar"><span>9:41</span><span class="island"></span><span class="status-icons">${icon('signal')}${icon('wifi')}${icon('battery')}</span></div><div class="phone-inner">${renderScreen(index)}${!board ? sheet() : ''}</div><span class="home-indicator"></span></div>`;
      }
      function render() {
        const t = T();
        document.documentElement.lang = state.lang === 'zh' ? 'zh-Hans' : 'en';
        document.getElementById('app').innerHTML =
          `<header class="review-header"><div class="brand"><span class="brand-mark">${icon('spark')}</span>${t.brand}</div><nav class="review-tabs" aria-label="${state.lang === 'zh' ? '设计稿视图' : 'Design views'}">${['preview', 'boards', 'spec'].map((v) => `<button class="${state.view === v ? 'active' : ''}" data-action="view" data-value="${v}" ${state.view === v ? 'aria-current="page"' : ''}>${t[v]}</button>`).join('')}</nav><div class="header-right"><span class="edition">${t.edition}</span><button class="lang" data-action="lang">${state.lang === 'zh' ? 'EN' : '中文'}</button></div></header>${state.view === 'preview' ? `<main class="preview"><div class="intro"><span class="eyebrow">${t.eyebrow}</span><h1>${t.headline}</h1><p class="lede">${t.lede}</p><div class="design-position"><h2>${String(state.screen + 1).padStart(2, '0')} / ${t.screenNames[state.screen]}</h2><p>${t.screenNotes[state.screen]}</p></div><div class="scenario" role="group" aria-label="${t.scenarioLabel}">${['healthy', 'offline', 'uncertain', 'note', 'clarify'].map((s) => `<button class="${state.scenario === s ? 'active' : ''}" data-action="scenario" data-value="${s}" aria-pressed="${state.scenario === s}">${t[s]}</button>`).join('')}</div><p class="demo-note">${t.demo}</p></div><div class="device-wrap"><div class="device-label"><span>01—06 / ${t.screenNames[state.screen]}</span><span>393 × 852</span></div>${phone(state.screen)}</div><nav class="screen-rail" aria-label="${state.lang === 'zh' ? '界面选择' : 'Screen selector'}">${t.screenNames.map((s, i) => `<button class="${state.screen === i ? 'active' : ''}" data-action="screen" data-value="${i}" ${state.screen === i ? 'aria-current="page"' : ''}><span class="rail-number">0${i + 1}</span>${s}</button>`).join('')}<div class="rail-rule"></div><p class="rail-caption">${t.rail}</p></nav></main>` : state.view === 'boards' ? `<main class="boards ${params.has('compact') ? 'compact' : ''}"><div class="boards-heading"><div><span class="eyebrow">SIX MOMENTS / ONE ASSISTANT</span><h1>${t.boardsHeading}</h1></div><p>${t.boardsLede}<br>${t.demo}</p></div><div class="boards-grid">${[0, 3, 4, 1, 2, 5].map((i) => `<article>${phone(i, true)}<div class="board-caption"><small>0${i + 1}</small>${t.screenNames[i]}</div><p class="board-note">${t.screenNotes[i]}</p></article>`).join('')}</div></main>` : `<main class="spec"><span class="eyebrow">PRODUCT LOGIC / DESIGN V1</span><h1>${t.specTitle}</h1><p class="spec-lede">${t.specLede}</p><div class="flow">${t.flow.map((s, i) => `${i ? '<b>→</b>' : ''}<span>${s}</span>`).join('')}</div><div class="spec-grid">${t.specSections.map(([h, p]) => `<section><h2>${h}</h2>${p}</section>`).join('')}</div></main>`}`;
      }
      let toastTimer;
      function toast(message) {
        const el = document.getElementById('toast');
        el.className = 'toast';
        el.textContent = message;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          el.className = '';
          el.textContent = '';
        }, 3200);
      }
      function go(index) {
        state.screen = index;
        state.view = 'preview';
        state.sheet = null;
        render();
      }
      document.addEventListener('input', (e) => {
        const key = e.target.dataset.input;
        if (key) state[key] = e.target.value;
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && state.sheet) {
          state.sheet = null;
          render();
        }
        if (e.key === 'Tab' && state.sheet) {
          const controls = document.querySelectorAll(
            '.sheet button:not(:disabled), .sheet input, .sheet textarea',
          );
          const first = controls[0];
          const last = controls[controls.length - 1];
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault();
            last?.focus();
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first?.focus();
          }
        }
      });
      document.addEventListener('click', async (e) => {
        const el = e.target.closest('[data-action]');
        if (!el) return;
        const a = el.dataset.action,
          v = el.dataset.value,
          t = T();
        const boardPhone = e.target.closest('.phone');
        if (state.view === 'boards' && boardPhone) {
          state.view = 'preview';
          state.screen = Number(boardPhone.dataset.screen);
        }
        if (a === 'view') {
          state.view = v;
          state.sheet = null;
          render();
          return;
        }
        if (a === 'lang') {
          state.lang = state.lang === 'zh' ? 'en' : 'zh';
          render();
          return;
        }
        if (a === 'screen') {
          go(Number(v));
          return;
        }
        if (a === 'home') {
          go(0);
          return;
        }
        if (a === 'voice') {
          state.listening = true;
          go(1);
          return;
        }
        if (a === 'receipt') {
          go(2);
          return;
        }
        if (a === 'workbench') {
          go(3);
          return;
        }
        if (a === 'memory') {
          go(5);
          return;
        }
        if (a === 'scenario') {
          state.scenario = v;
          state.lastInput = '';
          go(2);
          return;
        }
        if (a === 'send' || a === 'sendVoice') {
          if (
            a === 'sendVoice' &&
            state.editingVoice &&
            !state.voiceDraft.trim()
          ) {
            document.querySelector('#voice-edit')?.focus();
            return;
          }
          if (a === 'send' && !state.draft.trim()) {
            const input = document.querySelector('#assistant-input');
            input?.focus();
            return;
          }
          state.lastInput =
            a === 'sendVoice' ? state.voiceDraft || t.request : state.draft;
          state.draft = '';
          state.submitted = true;
          state.listening = false;
          go(2);
          return;
        }
        if (a === 'filter') {
          state.filter = Number(v);
          render();
          return;
        }
        if (a === 'editVoice') {
          state.voiceDraft ||= t.request;
          state.editingVoice = true;
          state.listening = false;
          render();
          document.querySelector('#voice-edit')?.focus();
          return;
        }
        if (a === 'toggleVoice') {
          state.listening = !state.listening;
          state.editingVoice = false;
          render();
          return;
        }
        if (a === 'copy') {
          try {
            await navigator.clipboard.writeText('ar-demo-ios-01');
            toast(t.copied);
          } catch {
            toast(t.copyUnavailable);
          }
          return;
        }
        if (a === 'lookup') {
          toast(t.lookupResult);
          return;
        }
        if (a === 'tree' || a === 'graph') {
          state.graph = a === 'graph';
          render();
          return;
        }
        if (a === 'detail') {
          state.detail = v;
          go(4);
          return;
        }
        if (a === 'save') {
          state.saved = !state.saved;
          toast(state.saved ? t.saved : t.unsaved);
          el.setAttribute('aria-pressed', String(state.saved));
          return;
        }
        if (a === 'continueTask') {
          state.sheet = 'task';
          render();
          toast(t.detailAdded);
          return;
        }
        if (a === 'newTask') {
          state.scenario = 'healthy';
          state.submitted = true;
          go(2);
          return;
        }
        if (a === 'notStarted') {
          toast(t.taskNotStarted);
          return;
        }
        if (a === 'acceptInsight') {
          state.goalLinked = true;
          go(3);
          toast(t.insightAccepted);
          return;
        }
        if (a === 'goal') {
          toast(t.goal);
          return;
        }
        if (a === 'forget') {
          state.memoryRemoved = true;
          render();
          toast(t.memoryForgot);
          return;
        }
        if (a === 'saveMemory') {
          state.memoryValue = (
            state.memoryEdit ||
            state.memoryValue ||
            t.memoryFact
          ).trim();
          state.sheet = null;
          render();
          toast(t.memoryUpdated);
          return;
        }
        if (a === 'confirmInference' || a === 'dismissInference') {
          state.inferenceState =
            a === 'confirmInference' ? 'confirmed' : 'dismissed';
          render();
          toast(
            a === 'confirmInference'
              ? t.inferenceConfirmed
              : t.inferenceDismissed,
          );
          return;
        }
        if (a === 'forgetInference') {
          state.inferenceState = 'dismissed';
          render();
          toast(t.memoryForgot);
          return;
        }
        if (a === 'addDetail') {
          if (!state.followup?.trim()) {
            document.querySelector('#task-followup')?.focus();
            return;
          }
          state.followup = '';
          state.sheet = null;
          render();
          toast(t.detailAdded);
          return;
        }
        if (a === 'closeSheet') {
          state.sheet = null;
          render();
          return;
        }
        if (
          [
            'computers',
            'reason',
            'source',
            'editMemory',
            'artifact',
            'task',
            'taskDone',
          ].includes(a)
        ) {
          state.sheet = a === 'taskDone' ? 'doneTask' : a;
          render();
          document.querySelector('.sheet .icon-button')?.focus();
        }
      });
      render();
    </script>
  </body>
</html>
