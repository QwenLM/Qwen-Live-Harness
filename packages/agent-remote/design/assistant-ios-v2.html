<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>我的助手 · iOS V2</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #fafbf8;
        --surface: #fffefa;
        --ink: #25352e;
        --muted: #758077;
        --line: #e8ece5;
        --green: #315b49;
        --soft: #edf2e9;
        --sand: #f0e4d7;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #eef0eb;
        color: var(--ink);
        font-family: 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        border: 0;
        background: none;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible,
      a:focus-visible {
        outline: 2px solid #527954;
        outline-offset: 3px;
      }
      svg {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .review-bar {
        height: 72px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 32px;
        border-bottom: 1px solid #dce2d7;
        gap: 16px;
      }
      .review-brand {
        display: flex;
        align-items: center;
        gap: 11px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .review-brand svg {
        width: 19px;
        height: 19px;
      }
      .v2 {
        font-size: 10px;
        font-weight: 500;
        background: #dfe7d8;
        border-radius: 5px;
        padding: 4px 6px;
      }
      .review-actions {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .review-actions button {
        min-height: 44px;
        padding: 0 14px;
        font-size: 12px;
        border-radius: 25px;
      }
      .review-actions button.active {
        background: #dde5d8;
      }
      .review-actions .lang {
        border: 1px solid #d3dccd;
        min-width: 48px;
        padding: 0 10px;
        margin-left: 8px;
      }
      .preview {
        display: grid;
        grid-template-columns: 230px 393px;
        gap: 88px;
        justify-content: center;
        align-items: center;
        padding: 47px 30px 55px;
      }
      .review-copy {
        align-self: center;
      }
      .review-copy .eyebrow {
        font-size: 10px;
        letter-spacing: 0.16em;
        color: #76816f;
      }
      .review-copy h1 {
        font-size: 32px;
        line-height: 1.55;
        font-weight: 500;
        letter-spacing: -0.045em;
        margin: 18px 0 22px;
      }
      .review-copy p {
        font-size: 13px;
        line-height: 1.95;
        color: #657360;
        margin: 0;
      }
      .review-copy .rule {
        width: 24px;
        height: 1px;
        background: #adbda2;
        margin: 30px 0;
      }
      .review-copy .demo {
        font-size: 11px;
        color: #7c8575;
        margin-top: 27px;
        line-height: 1.85;
      }
      .device {
        position: relative;
        width: 393px;
        height: 852px;
        background: var(--bg);
        border: 1px solid #bdc4b6;
        border-radius: 43px;
        overflow: hidden;
        box-shadow:
          0 0 0 7px #27362c,
          0 0 0 9px #b1baaa,
          0 20px 45px #31452a0e;
        display: flex;
        flex-direction: column;
      }
      .statusbar {
        height: 49px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 3px 25px 0 29px;
        position: relative;
        font-size: 14px;
        font-weight: 600;
      }
      .island {
        width: 104px;
        height: 28px;
        border-radius: 20px;
        background: #1e271f;
        position: absolute;
        top: 11px;
        left: 50%;
        transform: translateX(-50%);
      }
      .status-icons {
        display: flex;
        gap: 4px;
      }
      .status-icons svg {
        width: 15px;
        height: 15px;
        stroke-width: 1.9;
      }
      .phone-content {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        position: relative;
      }
      .app-header {
        height: 65px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 2px 18px 0 24px;
        flex-shrink: 0;
      }
      .app-header h1 {
        font-size: 23px;
        font-weight: 650;
        letter-spacing: -0.035em;
        margin: 0;
      }
      .app-header .inline-title {
        font-size: 15px;
        font-weight: 550;
      }
      .icon-button {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .icon-button:hover {
        background: #eaf0e4;
      }
      .header-spacer {
        width: 44px;
      }
      .scroll {
        overflow: auto;
        flex: 1;
        min-height: 0;
        scrollbar-width: none;
        overscroll-behavior: contain;
      }
      .scroll::-webkit-scrollbar {
        display: none;
      }
      .home-indicator {
        width: 124px;
        height: 5px;
        background: #293a2c;
        border-radius: 4px;
        position: absolute;
        bottom: 7px;
        left: 50%;
        transform: translateX(-50%);
        pointer-events: none;
        z-index: 20;
      }
      .tabbar {
        display: flex;
        flex-shrink: 0;
        height: 78px;
        border-top: 1px solid var(--line);
        padding: 6px 9px 18px;
        background: var(--bg);
      }
      .tabbar button {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 5px;
        align-items: center;
        justify-content: center;

        font-size: 10px;
      }
      .tabbar button.active {
        color: var(--green);

      }
      .tabbar svg {

        height: 22px;
      }
      .recent-section {
        padding: 14px 21px 0;

      .recent-heading {

      }
      .recent-card:hover {

      .recent-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        font-size: 10px;
        color: #626f59;
      }
      .recent-state {
        display: flex;
        align-items: center;
        gap: 5px;
        color: #626f59;
      }
      .recent-state.waiting {
        color: #7b6743;
      }
      .recent-state svg {
        width: 13px;
        height: 13px;
      }
      .recent-card h2 {
        margin: 11px 0 5px;
        font-size: 15px;
        font-weight: 550;
        line-height: 1.6;
        overflow-wrap: anywhere;
      }
      .recent-card p {
        margin: 0;
        font-size: 12px;
        color: #626f59;
        line-height: 1.8;
      }
      .instant-reply {
        margin: 21px 25px 24px;
        padding-top: 11px;
        border-top: 1px solid var(--line);
      }
      .reply-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #8a967e;
        font-size: 11px;
      }
      .reply-heading .icon-button {
        width: 44px;
        height: 44px;
      }
      .reply-heading svg {
        width: 14px;
        height: 14px;
      }
      .instant-reply p {
        margin: 6px 0 0;
        font-size: 14px;
        line-height: 1.9;
        color: #5c7252;
        overflow-wrap: anywhere;
      }
      .task-link {
        display: inline-flex;
        align-items: center;
        text-align: left;
        gap: 7px;
        padding: 9px 0 4px;
        font-size: 12px;
        color: var(--green);
        line-height: 1.7;
        min-height: 44px;
        max-width: 100%;
      }
      .task-link svg {
        width: 14px;
        height: 14px;
      }
      .task-link.waiting {
        color: #8a7859;
      }
      .task-link .link-text {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .composer-area {
        flex-shrink: 0;
        padding: 11px 16px 15px;
        background: var(--bg);
      }
      .compose-box {
        display: flex;
        align-items: center;
        min-height: 62px;
        padding: 7px;
        border: 1px solid #dce4d5;
        border-radius: 22px;
        background: #fffefa;
        gap: 1px;
      }
      .compose-box .icon-button {
        width: 44px;
        height: 44px;
      }
      .compose-box textarea {
        background: none;
        border: 0;
        width: 100%;
        min-width: 0;
        height: 44px;
        padding: 12px 3px;
        resize: none;
        font-size: 14px;
        line-height: 20px;
        outline-offset: 0;
      }
      .compose-box textarea::placeholder {
        color: #99a18f;
      }
      .compose-box .send {
        color: var(--green);
      }
      .live-button {
        border-left: 1px solid #e0e7d9;
        min-width: 68px;
        padding: 0 9px 0 10px;
        min-height: 44px;
        display: flex;
        gap: 4px;
        align-items: center;
        justify-content: center;
        color: var(--green);
        font-size: 13px;
      }
      .live-button svg {
        width: 16px;
        height: 16px;
      }
      .voice-preview {
        font-size: 12px;
        color: #6d7e65;
        padding: 0 6px 12px;
        line-height: 1.8;
      }
      .input-wave {
        display: flex;
        height: 44px;
        flex: 1;
        align-items: center;
        justify-content: center;
        gap: 4px;
        min-width: 0;
      }
      .input-wave i,
      .live-wave i {
        width: 3px;
        border-radius: 4px;
        background: #66835c;
        transform-origin: center;
        animation: wave 1.2s ease-in-out infinite alternate;
      }
      .input-wave i:nth-child(2n),
      .live-wave i:nth-child(2n) {
        animation-delay: -0.5s;
      }
      .recording {
        color: #9c624b;
      }
      .recording .stop {
        width: 15px;
        height: 15px;
        border-radius: 4px;
        background: currentColor;
      }
      @keyframes wave {
        to {
          transform: scaleY(0.45);
          opacity: 0.6;
        }
      }
      .feed-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        padding: 8px 15px 23px;
        align-items: start;
      }
      .feed-col {
        display: flex;
        flex-direction: column;
        gap: 21px;
      }
      .feed-card {
        display: block;
        padding: 0;
        text-align: left;
        width: 100%;
      }
      .feed-card h2 {
        font-size: 13px;
        line-height: 1.65;
        font-weight: 550;
        margin: 9px 3px 6px;
      }
      .feed-meta {
        font-size: 10px;
        color: #8a947f;
        margin: 0 3px;
        line-height: 1.6;
      }
      .cover {
        width: 100%;
        border-radius: 12px;
        position: relative;
        overflow: hidden;
        padding: 16px 13px;
        text-align: left;
        display: flex;
        flex-direction: column;
      }
      .cover .label {
        font-size: 8px;
        letter-spacing: 0.07em;
        font-weight: 550;
      }
      .cover h3 {
        font-size: 23px;
        line-height: 1.45;
        font-weight: 500;
        letter-spacing: -0.04em;
        margin: 14px 0 0;
      }
      .cover-design {
        background: #e3eadb;
        height: 209px;
      }
      .cover-design .mini-phone {
        position: absolute;
        width: 74px;
        height: 120px;
        border: 2px solid #53654c;
        background: #fcfcf5;
        border-radius: 12px;
        right: 17px;
        bottom: -27px;
        transform: rotate(10deg);
        padding: 14px 7px;
        box-shadow: -12px 5px 0 #c8d6bb;
      }
      .mini-line {
        width: 75%;
        height: 2px;
        background: #adbaa1;
        margin-bottom: 6px;
      }
      .mini-input {
        height: 20px;
        border: 1px solid #d3dfc7;
        border-radius: 5px;
        margin-top: 20px;
      }
      .mini-dots {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      .mini-dots i {
        width: 8px;
        height: 8px;
        background: #d1ddc5;
        border-radius: 50%;
      }
      .cover-memory {
        background: #efe7dc;
        height: 169px;
        color: #6d5844;
      }
      .cover-memory h3 {
        font-size: 21px;
      }
      .cover-memory .under {
        width: 39px;
        height: 1px;
        background: #cbb8a0;
        margin-top: 18px;
      }
      .cover-daily {
        height: 190px;
        background: #e8ecdf;
        color: #5f7051;
      }
      .cover-daily h3 {
        font-size: 22px;
        margin-top: 20px;
      }
      .cover-daily .daily-lines {
        margin-top: 16px;
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .daily-lines i {
        height: 3px;
        width: 80%;
        background: #becbad;
        border-radius: 4px;
      }
      .daily-lines i:nth-child(2) {
        width: 62%;
      }
      .daily-lines i:nth-child(3) {
        width: 71%;
      }
      .cover-note {
        height: 213px;
        background: #f1eadc;
        color: #736345;
      }
      .cover-note h3 {
        font-size: 22px;
      }
      .cover-note .note-detail {
        font-size: 10px;
        line-height: 1.8;
        margin-top: 18px;
        opacity: 0.8;
      }
      .cover-research {
        height: 171px;
        background: #e1e8e2;
        color: #436055;
      }
      .cover-research h3 {
        font-size: 22px;
      }
      .cover-week {
        height: 175px;
        background: #e8e5dc;
        color: #6b6a50;
      }
      .cover-week h3 {
        font-size: 22px;
      }
      .feed-end {
        text-align: center;
        font-size: 10px;
        color: #8b9582;
        padding: 4px 15px 25px;
      }
      .feed-sentinel {
        height: 1px;
      }
      .computer-selector {
        display: flex;
        align-items: center;
        gap: 11px;
        margin: 5px 22px 20px;
        min-height: 49px;
        padding: 4px 0;
        text-align: left;
        width: calc(100% - 44px);
      }
      .computer-selector svg {
        width: 22px;
        height: 22px;
      }
      .computer-selector .computer-name {
        flex: 1;
        font-size: 14px;
      }
      .computer-selector small {
        font-size: 10px;
        color: #74856a;
      }
      .status-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        display: inline-block;
        background: #76926b;

      }
      .status-dot.offline {
        background: #b39b73;
      }
      .computer-selector .chevron {
        width: 13px;
        height: 13px;
        color: #9ba58e;
      }
      .task-group {
        padding: 0 23px 18px;
      }

      }
      .group-title svg {

      }
      .task-row {
        display: block;
        text-align: left;
        width: 100%;
        padding: 16px 0;
        border-bottom: 1px solid var(--line);
      }
      .task-row:last-child {
        border-bottom: 0;
      }
      .task-row h2 {
        font-size: 15px;
        line-height: 1.7;

      }
      .task-meta {

        gap: 7px;

      }

      .toggle {
        width: 38px;
        height: 23px;
        border-radius: 15px;
        background: #d9dfd2;
        display: block;
        position: relative;
      }
      .toggle::after {
        content: '';
        position: absolute;
        left: 3px;
        top: 3px;
        width: 17px;
        height: 17px;
        border-radius: 50%;
        background: #fffef9;
        transition: transform 0.18s ease-out;
      }
      .toggle.on {
        background: #608357;
      }
      .toggle.on::after {
        transform: translateX(15px);
      }

      function live() {
        const copy = t();
        return `<div class="live-view"><div class="live-top">${icon('wave')}${copy.liveDemo}</div><h2>${copy.names[0]}</h2><p class="call-state">${state.muted ? copy.callMuted : copy.callListening}</p><div class="live-orbit"><div class="orb"><div class="live-wave" ${state.muted ? 'style="opacity:.3"' : ''}>${[10, 19, 30, 22, 12].map((h) => `<i style="height:${h}px;${state.muted ? 'animation:none' : ''}"></i>`).join('')}</div></div></div><p class="live-caption">${copy.callCaption}</p><div class="call-controls"><button class="call-control" data-action="mute" aria-pressed="${state.muted}"><span class="circle ${state.muted ? 'selected' : ''}">${icon(state.muted ? 'micOff' : 'mic')}</span><span>${state.muted ? copy.unmute : copy.mute}</span></button><button class="call-control" data-action="hangup"><span class="circle end">${icon('phone')}</span><span>${copy.hangup}</span></button><button class="call-control" data-action="speaker" aria-pressed="${state.speaker}"><span class="circle ${state.speaker ? 'selected' : ''}">${icon('speaker')}</span><span>${state.speaker ? copy.speaker : copy.earpiece}</span></button></div><span class="live-timer" data-call-time>${callDuration()}</span></div>`;
      }
      function callDuration() {
        const seconds = Math.max(
          0,
          Math.floor((Date.now() - (state.liveStarted || Date.now())) / 1000),
        );
        return `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
      }
      function sheet() {
        if (!state.sheet) return '';
        const copy = t();
        let name = '',
          body = '';
        if (state.sheet === 'newTask') {
          const selected = machine(state.selectedComputer);
          name = copy.newTask;
          body = `<label class="form-label" for="new-computer">${copy.computer}</label><select id="new-computer" data-input="selectedComputer">${computers.map((c) => `<option value="${c.id}" ${c.id === state.selectedComputer ? 'selected' : ''}>${c.name} · ${c.online ? copy.available : copy.unavailable}</option>`).join('')}</select><div class="form-grid"><div><label class="form-label" for="new-project">${copy.project}</label><select id="new-project" data-input="newProject"><option value="remote" ${state.newProject === 'remote' ? 'selected' : ''}>${copy.agentRemote}</option><option value="research" ${state.newProject === 'research' ? 'selected' : ''}>${copy.researchProject}</option></select></div><div><label class="form-label" for="new-agent">${copy.agent}</label><select id="new-agent" data-input="newAgent"><option ${state.newAgent === 'Qwen Code' ? 'selected' : ''}>Qwen Code</option><option ${state.newAgent === 'Codex' ? 'selected' : ''}>Codex</option></select></div></div><label class="form-label" for="new-request">${copy.request}</label><textarea id="new-request" data-input="taskDraft" placeholder="${copy.requestPlaceholder}">${esc(state.taskDraft)}</textarea><button class="primary" data-action="createTask">${selected.online ? copy.startTask : copy.saveTask}</button>`;
        } else if (state.sheet === 'computers') {
          name = copy.computers;
          body = computers
            .map(
              (c) =>
                `<button class="computer-option" data-action="selectComputer" data-value="${c.id}">${icon('laptop')}<span class="name">${c.name}<small><i class="status-dot ${c.online ? '' : 'offline'}"></i>${c.online ? copy.available : copy.unavailable}</small></span>${c.id === state.selectedComputer ? icon('check').replace('<svg', '<svg class="checked"') : ''}</button>`,
            )
            .join('');
        } else if (state.sheet === 'memory') {
          name = copy.memory;
          body = `<p>${copy.memoryExplain}</p>${state.memoryForgot ? `<p>${copy.memoryEmpty}</p>` : `<article class="memory-note"><h3>${esc(state.memoryValue || copy.memoryValue)}</h3><p>${copy.memoryOrigin}</p><button data-action="editMemory">${copy.editMemory}</button><button data-action="forgetMemory">${copy.forgetMemory}</button></article>`}`;
        } else if (state.sheet === 'editMemory') {
          name = copy.editLabel;
          body = `<label class="form-label" for="memory-value">${copy.memory}</label><textarea id="memory-value" data-input="memoryEdit">${esc(state.memoryValue || copy.memoryValue)}</textarea><button class="primary" data-action="saveMemory">${copy.save}</button>`;
        } else if (state.sheet === 'voiceSetting') {
          name = copy.liveVoice;
          body = [copy.naturalVoice, copy.quietVoice]
            .map(
              (v, i) =>
                `<button class="computer-option" data-action="setVoice" data-value="${i}"><span class="name">${v}</span>${state.softVoice === (i === 1) ? icon('check') : ''}</button>`,
            )
            .join('');
        } else {
          name = state.sheet === 'privacy' ? copy.dataPrivacy : copy.about;
          body = `<p>${state.sheet === 'privacy' ? copy.privacyBody : copy.aboutText}</p>`;
        }
        return `<div class="sheet-scrim"><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(name)}"><div class="sheet-handle"></div><div class="sheet-head"><h2>${name}</h2>${iconButton('close', 'closeSheet', copy.close)}</div>${body}</section></div>`;
      }
      function device(index, board = false) {
        const isLive = !board && state.live,
          isDetail = !board && state.page,
          body = isLive
            ? live()
            : isDetail
              ? state.page === 'task'
                ? taskDetail()
                : feedDetail()
              : [assistant, workbench, feed, settings][index]();
        return `<div class="device" data-tab="${index}" data-page="${isDetail ? state.page : 'root'}"><div class="statusbar"><span>9:41</span><i class="island"></i><span class="status-icons">${icon('signal')}${icon('wifi')}${icon('battery')}</span></div><div class="phone-content">${body}${isLive ? '' : tabs(index)}${!board ? sheet() : ''}</div><span class="home-indicator"></span></div>`;
      }
      const scrollPositions = {};
      function render() {
        const copy = t();
        document.querySelectorAll('.device .scroll').forEach((el) => {
          const d = el.closest('.device');
          scrollPositions[`${d.dataset.tab}:${d.dataset.page}`] = el.scrollTop;
        });
        document.documentElement.lang = state.lang === 'zh' ? 'zh-Hans' : 'en';
        document.getElementById('app').innerHTML =
          `<header class="review-bar"><div class="review-brand">${icon('assistant')}${copy.brand}<span class="v2">V2</span></div><nav class="review-actions" aria-label="${state.lang === 'zh' ? '设计稿视图' : 'Design views'}"><button data-action="view" data-value="interactive" class="${state.view === 'interactive' ? 'active' : ''}">${copy.interactive}</button><button data-action="view" data-value="overview" class="${state.view === 'overview' ? 'active' : ''}">${copy.overview}</button><button class="lang" data-action="lang">${state.lang === 'zh' ? 'EN' : '中文'}</button></nav></header>${state.view === 'interactive' ? `<main class="preview"><aside class="review-copy"><span class="eyebrow">IOS CONCEPT / SECOND EDITION</span><h1>${copy.title}</h1><p>${copy.summary}</p><div class="rule"></div><p>${copy.principles}</p><p class="demo">${copy.demo}</p></aside>${device(state.tab)}</main>` : `<main class="overview"><div class="overview-head"><h1>${copy.overviewTitle}</h1><p>${copy.overviewNote}<br>${copy.demo}</p></div><div class="overview-grid">${copy.names.map((name, i) => `<article>${device(i, true)}<div class="board-caption"><small>0${i + 1}</small>${name}</div><p class="board-note">${copy.notes[i]}</p></article>`).join('')}</div></main>`}`;
        document.querySelectorAll('.device .scroll').forEach((el) => {
          const d = el.closest('.device');
          el.scrollTop =
            state.scrollToEnd && el.hasAttribute('data-assistant-scroll')
              ? el.scrollHeight
              : scrollPositions[`${d.dataset.tab}:${d.dataset.page}`] || 0;
        });
        state.scrollToEnd = false;
      }
      let toastTimer;
      function toast(message) {
        const el = document.getElementById('toast');
        el.textContent = message;
        el.className = 'toast';
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          el.textContent = '';
          el.className = '';
        }, 3000);
      }
      function openTab(index) {
        state.tab = index;
        state.page = null;
        state.sheet = null;
        state.recording = false;
        state.view = 'interactive';
        render();
      }
      function openTask(id) {
        const task = tasks.find((x) => x.id === id);
        if (!task) return;
        state.selectedTask = id;
        state.selectedComputer = task.computer;
        state.followup = '';
        state.tab = 1;
        state.page = 'task';
        state.sheet = null;
        state.view = 'interactive';
        render();
      }
      function rememberRecent(id) {
        state.recentTaskIds = [
          id,
          ...state.recentTaskIds.filter((item) => item !== id),
        ].slice(0, 3);
      }
      function sendInput() {
        const text = state.draft.trim();
        if (!text) return;
        state.draft = '';
        // Scripted demo only. The future harness decides whether to answer or delegate.
        if (/设计稿|做一版|任务|实现|design|build|task|fix/i.test(text)) {
          const id = `demo-input-${Date.now()}`,
            available = machine(state.selectedComputer).online;
          tasks.unshift({
            id,
            title: text,
            computer: state.selectedComputer,
            agent: 'Qwen Code',
            project: 'remote',
            status: available ? 'running' : 'pending',
            source: 'assistant',
            updatedLabel: clockTime(),
            ...(available ? { session: `${id}-session` } : {}),
          });
          rememberRecent(id);
          state.reply = {
            text: available ? t().taskReply : t().queuedReply,
            task: id,
          };
        } else {
          state.reply = {
            text: /tab|入口|几个/i.test(text)
              ? t().directTabs
              : /语音|live|通话|voice|call/i.test(text)
                ? t().directVoice
                : t().plainReply,
          };
        }
        state.scrollToEnd = true;
        render();
        document.querySelector('#assistant-draft')?.focus();
      }
      function openSheet(name) {
        state.sheet = name;
        render();
        document.querySelector('.sheet .icon-button')?.focus();
      }
      document.addEventListener('input', (e) => {
        const key = e.target.dataset.input;
        if (!key) return;
        state[key] = e.target.value;
        if (key === 'draft') {
          const b = document.querySelector('.compose-box .icon-button');
          if (b) {
            b.dataset.action = state.draft.trim() ? 'send' : 'text';
            b.setAttribute(
              'aria-label',
              state.draft.trim() ? t().send : t().textInput,
            );
            b.innerHTML = icon(state.draft.trim() ? 'arrow' : 'keyboard');
          }
        }
      });
      document.addEventListener('change', (e) => {
        const key = e.target.dataset.input;
        if (key) {
          state[key] = e.target.value;
          if (key === 'selectedComputer' && state.sheet === 'newTask') render();
        }
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && state.sheet) {
          state.sheet = null;
          render();
        }
        if (
          e.target.id === 'assistant-draft' &&
          e.key === 'Enter' &&
          !e.shiftKey &&
          !e.isComposing
        ) {
          e.preventDefault();
          sendInput();
        }
        if (e.key === 'Tab' && state.sheet) {
          const controls = document.querySelectorAll(
              '.sheet button:not(:disabled),.sheet input,.sheet textarea,.sheet select',
            ),
            first = controls[0],
            last = controls[controls.length - 1];
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault();
            last?.focus();
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first?.focus();
          }
        }
      });
      document.addEventListener('click', (e) => {
        const el = e.target.closest('[data-action]');
        if (!el) return;
        const a = el.dataset.action,
          v = el.dataset.value,
          copy = t();
        const board = e.target.closest('.device');
        if (state.view === 'overview' && board) {
          state.tab = Number(board.dataset.tab);
          state.view = 'interactive';
          render();
        }
        if (a === 'view') {
          state.view = v;
          state.sheet = null;
          state.page = null;
          state.live = false;
          state.recording = false;
          render();
          return;
        }
        if (a === 'lang') {
          state.lang = state.lang === 'zh' ? 'en' : 'zh';
          render();
          return;
        }
        if (a === 'tab') {
          openTab(Number(v));
          return;
        }
        if (a === 'back') {
          state.page = null;
          render();
          return;
        }
        if (a === 'text') {
          document.querySelector('#assistant-draft')?.focus();
          return;
        }
        if (a === 'dismissReply') {
          state.reply = null;
          render();
          return;
        }
        if (a === 'send') {
          sendInput();
          return;
        }
        if (a === 'voice') {
          if (state.recording) {
            state.recording = false;
            state.draft = copy.voiceText;
            render();
            document.querySelector('#assistant-draft')?.focus();
          } else {
            state.recording = true;
            render();
          }
          return;
        }
        if (a === 'cancelVoice') {
          state.recording = false;
          render();
          return;
        }
        if (a === 'live') {
          state.live = true;
          state.liveStarted = Date.now();
          state.recording = false;
          render();
          return;
        }
        if (a === 'mute') {
          state.muted = !state.muted;
          render();
          return;
        }
        if (a === 'speaker') {
          state.speaker = !state.speaker;
          render();
          return;
        }
        if (a === 'hangup') {
          const duration = callDuration();
          state.live = false;
          state.liveStarted = null;
          state.reply = {
            text: `${copy.liveRecord} · ${duration} · ${copy.liveReply}`,
          };
          state.scrollToEnd = true;
          openTab(0);
          toast(copy.liveEnded);
          return;
        }
        if (a === 'openTask') {
          openTask(v);
          return;
        }
        if (a === 'newTask') {
          state.taskDraft = '';
          openSheet('newTask');
          return;
        }
        if (a === 'createTask') {
          const text = state.taskDraft.trim();
          if (!text) {
            toast(copy.missingInput);
            document.querySelector('#new-request')?.focus();
            return;
          }
          const id = `demo-manual-${Date.now()}`,
            available = machine(state.selectedComputer).online;
          tasks.unshift({
            id,
            title: text,
            computer: state.selectedComputer,
            project: state.newProject,
            agent: state.newAgent,
            status: available ? 'running' : 'pending',
            source: 'manual',
            ...(available ? { session: `${id}-session` } : {}),
          });
          rememberRecent(id);
          state.taskDraft = '';
          openTab(1);
          toast(available ? copy.added : copy.taskSaved);
          return;
        }
        if (a === 'resumeTask') {
          const task = tasks.find((x) => x.id === state.selectedTask);
          if (!task) return;
          if (!machine(state.selectedComputer).online) {
            openSheet('computers');
            return;
          }
          task.computer = state.selectedComputer;
          task.status = 'running';
          task.session = `${task.id}-session`;
          task.activity = 'taskActivity';
          render();
          toast(copy.resumed);
          return;
        }
        if (a === 'followup') {
          const task = tasks.find((x) => x.id === state.selectedTask);
          if (!task || !state.followup.trim()) {
            document.querySelector('#task-followup')?.focus();
            return;
          }
          task.followups ??= [];
          task.followups.push(state.followup.trim());
          state.followup = '';
          render();
          toast(copy.followupAdded);
          return;
        }
        if (a === 'feedDetail') {
          state.selectedFeed = Number(v);
          state.tab = 2;
          state.page = 'feed';
          state.view = 'interactive';
          render();
          return;
        }
        if (a === 'taskArtifact') {
          const task = tasks.find((item) => item.id === state.selectedTask);
          if (!Number.isInteger(task?.artifactIndex)) return;
          state.selectedFeed = task.artifactIndex;
          state.tab = 2;
          state.page = 'feed';
          render();
          return;
        }
        if (a === 'saveFeed') {
          const i = state.selectedFeed % 6;
          state.saved[i] = !state.saved[i];
          render();
          toast(state.saved[i] ? copy.saved : copy.removeSaved);
          return;
        }
        if (a === 'notifications') {
          state.notifications = !state.notifications;
          render();
          return;
        }
        if (a === 'setVoice') {
          state.softVoice = v === '1';
          state.sheet = null;
          render();
          return;
        }
        if (a === 'selectComputer') {
          state.selectedComputer = v;
          state.sheet = null;
          render();
          return;
        }
        if (a === 'editMemory') {
          state.memoryEdit = state.memoryValue || copy.memoryValue;
          openSheet('editMemory');
          return;
        }
        if (a === 'saveMemory') {
          if (!state.memoryEdit.trim()) return;
          state.memoryValue = state.memoryEdit.trim();
          state.sheet = null;
          render();
          toast(copy.memoryUpdated);
          return;
        }
        if (a === 'forgetMemory') {
          state.memoryForgot = true;
          render();
          toast(copy.memoryForgot);
          return;
        }
        if (a === 'closeSheet') {
          state.sheet = null;
          render();
          return;
        }
        if (
          ['computers', 'memory', 'voiceSetting', 'privacy', 'about'].includes(
            a,
          )
        ) {
          openSheet(a);
        }
      });
      setInterval(() => {
        if (state.live) {
          const el = document.querySelector('[data-call-time]');
          if (el) el.textContent = callDuration();
        }
      }, 1000);
      render();
    </script>
  </body>
</html>
