appId: 'com.alibaba.qwen-live-harness.host'
productName: 'Qwen Live Harness Host'
copyright: 'Copyright © 2026 Alibaba Group.'
electronVersion: '39.2.7'
npmRebuild: false

directories:
  output: 'release'
  buildResources: 'resources'

files:
  - 'dist/main.cjs'
  - 'dist/preload.cjs'
  - 'dist/subagents-preload.cjs'
  - 'dist/renderer/**/*'
  - 'package.json'

extraMetadata:
  main: 'dist/main.cjs'

asar: true

electronFuses:
  resetAdHocDarwinSignature: true
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true

afterPack: 'scripts/after-pack.cjs'

mac:
  category: 'public.app-category.utilities'
  icon: 'dist/icon.icns'
  minimumSystemVersion: '12.0.0'
  extendInfo:
    LSUIElement: true
    QwenLiveHarnessProtocolVersion: 9
    NSMicrophoneUsageDescription: 'Qwen Live Harness Host uses the microphone for live voice conversations with Qwen Live Harness.'
    NSCameraUsageDescription: 'Qwen Live Harness Host uses the camera to share visual context with Qwen Live Harness when you turn it on.'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: 'build/entitlements.mac.plist'
  entitlementsInherit: 'build/entitlements.mac.plist'
  extraResources:
    - from: 'dist/icon.png'
      to: 'qwen-live-harness-host-icon.png'
    - from: 'dist/native/qwen-live-harness-appshot.node'
      to: 'native/qwen-live-harness-appshot.node'
  target:
    - target: 'dmg'
      arch:
        - 'arm64'
        - 'x64'
    - target: 'zip'
      arch:
        - 'arm64'
        - 'x64'
  artifactName: 'Qwen-Live-Harness-Host-${arch}.${ext}'

dmg:
  artifactName: 'Qwen-Live-Harness-Host-${arch}.dmg'
  title: 'Qwen Live Harness Host'
  icon: 'dist/icon.icns'
  contents:
    - x: 130
      y: 200
    - x: 410
      y: 200
      type: 'link'
      path: '/Applications'
  window:
    width: 540
    height: 380
